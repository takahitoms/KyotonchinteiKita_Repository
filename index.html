<!DOCTYPE html>
<html lang="ja">
<head>

<title>鉄板居酒屋 京とんちん亭 京都駅前北店</title>

<style>
body {
  margin: 0;
  font-family: "Hiragino Kaku Gothic ProN", sans-serif;
  background-color: #3e1f17;
}

header {
  background-color: #6b2f1f;
  color: white;
  text-align: center;
  padding: 20px;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

.hero img {

}

.container {

  padding: 20px;
  border-radius: 10px;
  text-align: center;
}

/* 食べログ */
.btn-main {

  background-color: #b22222;

  text-decoration: none;
  padding: 15px;

  width: 80%;
  max-width: 400px;
  font-size: 18px;
  border-radius: 5px;
}

  width: 80%;
  max-width: 400px;
  font-size: 16px;
  border: 2px solid #b22222;
  border-radius: 5px;
}

.tel a {
  color: #b22222;
  text-decoration: none;
  font-size: 20px;
  font-weight: bold;
}

.gallery {
  display: flex;
  flex-wrap: wrap;

  justify-content: center;
}

.gallery img {

  border-radius: 5px;

</style>
</head>

<body>
