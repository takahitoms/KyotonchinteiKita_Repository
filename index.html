<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>鉄板居酒屋 京とんちん亭 京都駅前北店</title>

<style>
body {
  margin: 0;
  font-family: "Hiragino Kaku Gothic ProN", sans-serif;
  background-color: #3e1f17;
}

/* ヘッダー */
header {
  background-color: #b22222; /* 食べログボタンと統一 */
  color: white;
  text-align: center;
  padding: 20px;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

/* メイン画像 */
.hero img {
  width: 100%;
  display: block;
}

/* コンテンツ枠 */
.container {
  background-color: white;
  margin: 20px;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
}

/* ボタン共通 */
.btn {
  display: block;
  text-decoration: none;
  padding: 15px;
  margin: 15px auto;
  width: 80%;
  max-width: 400px;
  font-size: 18px;
  border-radius: 5px;
  font-weight: bold;
}

/* 食べログ（メイン） */
.btn-tabelog {
  background-color: #b22222;
  color: white;
}

/* ホットペッパー（同色に統一） */
.btn-hotpepper {
  background-color: #b22222;
  color: white;
}

/* 電話（白ボタン） */
.btn-tel {
  background-color: white;
  color: #b22222;
  border: 2px solid #b22222;
}

/* ギャラリー */
.gallery {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

.gallery img {
  width: 45%;
  border-radius: 5px;
}

</style>
</head>

<body>

<header>
<h1>
鉄板居酒屋<br>
京とんちん亭 京都駅前北店
</h1>
</header>

<div class="hero">
<img src="02.北店ファサード２.jpg">
</div>

<div class="container">

<h2>京都駅すぐ。鉄板料理を気軽に。</h2>

<!-- 食べログ -->
<a class="btn btn-tabelog" href="https://yoyaku.tabelog.com/yoyaku/net_booking_form/index?rcd=26024890" target="_blank">
食べログで予約する
</a>

<!-- ホットペッパー -->
<a class="btn btn-hotpepper" href="https://kyoutonchintei.owst.jp/" target="_blank">
ホットペッパーで予約する
</a>

<!-- 電話 -->
<a class="btn btn-tel" href="tel:0753439955">
☎ 電話で予約する
</a>

</div>

<div class="container">

<h2>店内・料理</h2>

<div class="gallery">
<img src="京やきそば.jpg">
<img src="お好み焼き.jpg">
<img src="唐揚げ.jpg">
<img src="厚切りベーコン.jpg">
<img src="ガーリックチャーハン.jpg">
<img src="お漬物.jpg">
<img src="04.北店店内1.jpg">
<img src="07.北店店内4.jpg">
</div>

</div>

</body>
</html>
