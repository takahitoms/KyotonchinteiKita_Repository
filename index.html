<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>鉄板居酒屋 京とんちん亭 京都駅前北店</title>

  <style>
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: #f8f5f2;
      color: #333;
    }

    header {
      background-color: #6b2f1f; /* 赤茶色 */
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.5;
    }

    .hero img {
      width: 100%;
      height: auto;
      display: block;
    }

    .container {
      padding: 20px;
      text-align: center;
    }

    h2 {
      font-size: 20px;
      margin-top: 10px;
    }

    /* 予約ボタン */
    .btn {
      display: block;
      background-color: #b22222;
      color: white;
      text-decoration: none;
      padding: 15px;
      margin: 20px auto;
      width: 80%;
      max-width: 400px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 5px;
    }

    .btn:hover {
      background-color: #8b1a1a;
    }

    .tel {
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }

    .tel a {
      color: #6b2f1f;
      text-decoration: none;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 10px;
    }

    .gallery img {
      width: 45%;
      border-radius: 5px;
    }

  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header>
    <h1>
      鉄板居酒屋<br>
      京とんちん亭 京都駅前北店
    </h1>
  </header>

  <!-- メイン画像 -->
  <div class="hero">
    <img src="02.北店ファサード２.jpg" alt="店舗メイン画像">
  </div>

  <!-- メイン導線 -->
  <div class="container">

    <h2>京都駅すぐ。鉄板料理を気軽に。</h2>

    <!-- 予約ボタン -->
    <a class="btn" href="https://yoyaku.tabelog.com/yoyaku/net_booking_form/index?rcd=26024890" target="_blank">
      ネット予約はこちら（食べログ）
    </a>

    <!-- 電話 -->
    <div class="tel">
      <a href="tel:075-343-9955">
        ☎ 電話で予約する
      </a>
    </div>

  </div>

  <!-- ギャラリー -->
  <div class="container">

    <h2>店内・料理</h2>

    <div class="gallery">
      <img src="京やきそば.jpg" alt="料理1">
      <img src="お好み焼き.jpg" alt="料理2">
      <img src="唐揚げ.jpg" alt="料理3">
      <img src="厚切りベーコン.jpg" alt="料理4">
      <img src="ガーリックチャーハン.jpg" alt="料理5">
      <img src="お漬物.jpg" alt="料理6">
      <img src="04.北店店内1.jpg" alt="店内1">
    </div>

  </div>

</body>
</html>
