  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    /**
     * CV送信→送信後に遷移（event_callback）
     * - JSが無効/gtag未読込なら通常遷移（return true）
     * - gtagが使えるならCV送信後に遷移（return falseで一旦止める）
     */
    function trackAndGo(sendTo, url, newTab) {
      try {
        if (typeof gtag !== 'function') return true;

        let navigated = false;
        const go = function() {
          if (navigated) return;
          navigated = true;

          if (!url) return;
          if (newTab) {
            window.open(url, '_blank', 'noopener');
          } else {
            window.location.href = url;
          }
        };

        gtag('event', 'conversion', {
          'send_to': sendTo,
          'event_callback': go
        });

        // 念のためのフォールバック（callbackが呼ばれない場合に遷移）
        setTimeout(go, 800);

        return false; // デフォルト遷移を止めて callback 後に遷移
      } catch (e) {
        return true; // 何かあれば通常遷移
      }
    }
  </script>
