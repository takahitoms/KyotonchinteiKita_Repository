
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>鉄板居酒屋 京とんちん亭 京都駅前北店</title>

  <style>
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: #f8f5f2;
      color: #333;
    }

    header {
      background-color: #6b2f1f; /* 赤茶色 */
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.5;
    }

    /* メインビジュアル */
    .hero {
      width: 100%;
    }

    .hero img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* セクション */
    .container {
      padding: 20px;
      text-align: center;
    }

    /* 予約ボタン */
    .btn {
      display: block;
      background-color: #b22222;
      color: white;
      text-decoration: none;
      padding: 15px;
      margin: 20px auto;
      width: 80%;
      max-width: 400px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 5px;
    }

    .btn:hover {
      background-color: #8b1a1a;
    }

    /* ギャラリー */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .gallery img {
      width: 45%;
      border-radius: 5px;
    }

    /* 電話 */
    .tel {
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }

    .tel a {
      color: #6b2f1f;
      text-decoration: none;
    }

  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header>
    <h1>
      鉄板居酒屋<br>
      京とんちん亭 京都駅前北店
    </h1>
  </header>

  <!-- メイン写真 -->
  <div class="hero">
    <img src="main.jpg" alt="鉄板料理メイン写真">
  </div>

  <!-- コンテンツ -->
  <div class="container">

    <h2>京都駅すぐ。鉄板料理を気軽に。</h2>

    <!-- 予約ボタン -->
    <a class="btn"
      href="https://yoyaku.tabelog.com/yoyaku/net_booking_form/index?rcd=26024890"
      target="_blank">
      ネット予約はこちら
    </a>

    <!-- 電話 -->
    <div class="tel">
      <a href="tel:075-XXXX-XXXX">
        ☎ 電話で予約する
      </a>
    </div>

  </div>

  <!-- 写真ギャラリー -->
  <div class="container">

    <h2>店内・料理</h2>

    <div class="gallery">
      <img src="photo1.jpg" alt="">
      <img src="photo2.jpg" alt="">
      <img src="photo3.jpg" alt="">
      <img src="photo4.jpg" alt="">
    </div>

  </div>

</body>
</html>
